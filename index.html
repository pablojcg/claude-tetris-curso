<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/skins.css" />
  <link rel="stylesheet" href="css/scores.css" />
  <link rel="stylesheet" href="css/menus.css" />
  <link rel="stylesheet" href="css/gameover.css" />
  <link rel="stylesheet" href="css/start.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <button
        id="theme-toggle"
        class="theme-switch"
        type="button"
        aria-label="Cambiar entre modo claro y oscuro"
        aria-pressed="false"
      >
        <span class="theme-switch-thumb"></span>
      </button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Pantallas (solo una visible a la vez, ver core.js). Cada feature es dueña del
         contenido de su(s) punto(s) de montaje y lo (re)construye desde su propio .js. -->
    <div id="screen-start" class="screen hidden">
      <div class="screen-box">
        <p class="screen-title">TETRIS</p>
        <div id="start-records"></div>
        <div id="start-options"></div>
        <button id="play-btn" class="btn" type="button">Jugar</button>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <div class="screen-box">
        <p class="screen-title">PAUSA</p>
        <div id="pause-menu">
          <button id="resume-btn" class="btn" type="button">Reanudar</button>
          <button id="pause-restart-btn" class="btn" type="button">Reiniciar</button>
        </div>
      </div>
    </div>

    <div id="screen-gameover" class="screen hidden">
      <div class="screen-box">
        <p class="screen-title">GAME OVER</p>
        <p id="gameover-score"></p>
        <div id="gameover-records"></div>
        <button id="restart-btn" class="btn" type="button">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="skins.js"></script>
  <script src="scores.js"></script>
  <script src="menus.js"></script>
  <script src="gameover.js"></script>
  <script src="start.js"></script>
  <script src="game.js"></script>
</body>
</html>
