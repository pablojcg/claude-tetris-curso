<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <button
        id="theme-toggle"
        class="theme-switch"
        type="button"
        aria-label="Cambiar entre modo claro y oscuro"
        aria-pressed="false"
      >
        <span class="theme-switch-thumb"></span>
      </button>
      <select id="skin-select" class="skin-select" aria-label="Elegir skin">
        <option value="retro">Retro</option>
        <option value="neon">Neon</option>
        <option value="pastel">Pastel</option>
        <option value="pixel">Pixel art</option>
      </select>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div id="gameover-view" class="overlay-box hidden">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>

      <div id="pause-view" class="overlay-box hidden" role="dialog" aria-label="Menú de pausa">
        <p id="pause-title">PAUSA</p>
        <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
        <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
        <button id="controls-btn" class="menu-btn" type="button">Ver controles</button>
        <label class="level-select">
          <span>Nivel inicial</span>
          <select id="start-level"></select>
        </label>
        <p class="menu-hint">Se aplica a la próxima partida</p>
      </div>

      <div id="controls-view" class="overlay-box hidden">
        <p id="controls-title">CONTROLES</p>
        <ul class="controls-list">
          <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
          <li><span><kbd>↓</kbd></span> bajar</li>
          <li><span><kbd>Space</kbd></span> caída</li>
          <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
        </ul>
        <button id="controls-back-btn" class="menu-btn" type="button">Volver</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
